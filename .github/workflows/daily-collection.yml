name: Coleta diária de imóveis

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write

concurrency:
  group: daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar coleta do Zap Imóveis
        run: python src/generate_zap_data.py

      - name: Executar coleta do Quinto Andar
        run: python src/generate_quintoandar_data.py

      - name: Comparar coletas
        run: python src/compare_daily_urls.py

      - name: Commitar resultados
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed

          if git diff --cached --quiet; then
            echo "Nenhum CSV novo ou alterado para commitar."
            exit 0
          fi

          git commit -m "chore: atualizar dados de aluguel"
          git push origin HEAD:${GITHUB_REF_NAME}
