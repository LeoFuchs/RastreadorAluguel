name: Coleta diária de imóveis

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write

concurrency:
  group: daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
      GOOGLE_SHEETS_WORKSHEET: ${{ vars.GOOGLE_SHEETS_WORKSHEET || 'Curadoria Imóveis' }}
      CURATORIA_MAX_URLS: ${{ vars.CURATORIA_MAX_URLS || '25' }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar coleta do Quinto Andar
        run: python src/generate_quintoandar_data.py

      - name: Comparar coletas
        run: python src/compare_daily_urls.py

      - name: Curadoria automática com Gemini e Google Sheets
        run: python src/curadoria_imoveis.py

      - name: Commitar resultados
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed data/curated

          if git diff --cached --quiet; then
            echo "Nenhum CSV novo ou alterado para commitar."
            exit 0
          fi

          git commit -m "chore: atualizar dados e curadoria de aluguel"
          git push origin HEAD:${GITHUB_REF_NAME}
